services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cadence
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate --database=migrate && python manage.py enable_rls --database=migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://cadence_app:cadence_app@db:5432/cadence
      MIGRATE_DATABASE_URL: postgres://cadence:cadence@db:5432/cadence
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    # Runs the daily jobs at SCHEDULER_DAILY_AT: each facility's (PM work orders, report emails, staff emails) on its own clock, the
    # openFDA recall import on the server's (DJANGO_TIME_ZONE).
    # The web service applies migrations; the scheduler starts after it and runs nothing until they are all applied,
    # retrying quietly while the database is not ready. `init: true` passes `docker compose stop` on to the scheduler,
    # which records a job in flight as stopped.
    build: .
    init: true
    command: python manage.py scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgres://cadence_app:cadence_app@db:5432/cadence
      MIGRATE_DATABASE_URL: postgres://cadence:cadence@db:5432/cadence
      SCHEDULER_DAILY_AT: ${SCHEDULER_DAILY_AT:-02:30}
    volumes: [".:/app"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
volumes:
  pgdata:
