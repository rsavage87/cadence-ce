<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence CE — Clinical Engineering equipment management (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--surface-2:#F5F7F9;--line:#D8DFE6;--line-2:#BFC9D3;
  --ink:#14212B;--ink-2:#4A5966;--ink-3:#77858F;
  --accent:#0B6F86;--accent-ink:#FFFFFF;--accent-soft:#DCEFF3;--accent-line:#8DC5D2;
  --ok:#1E7A3F;--ok-soft:#DCF2E3;--warn:#A85F00;--warn-soft:#FFEFD0;--crit:#B0202E;--crit-soft:#FCE1E4;
  --info:#2F5FB3;--info-soft:#E3EAF8;--violet:#6D4FC2;--violet-soft:#EBE5FA;
  --shadow:0 12px 32px rgba(20,33,43,.14);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171D;--surface:#151F27;--surface-2:#1B2731;--line:#283642;--line-2:#3A4B59;
    --ink:#E8EEF3;--ink-2:#AFBCC7;--ink-3:#7C8B97;
    --accent:#48B8CC;--accent-ink:#0B1519;--accent-soft:#143640;--accent-line:#256A78;
    --ok:#4FC77A;--ok-soft:#12331F;--warn:#E9A93E;--warn-soft:#3A2A0F;--crit:#F27380;--crit-soft:#4A1E24;
    --info:#7FA6F0;--info-soft:#1D2C48;--violet:#B39DF0;--violet-soft:#2C2447;
    --shadow:0 12px 32px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171D;--surface:#151F27;--surface-2:#1B2731;--line:#283642;--line-2:#3A4B59;
  --ink:#E8EEF3;--ink-2:#AFBCC7;--ink-3:#7C8B97;
  --accent:#48B8CC;--accent-ink:#0B1519;--accent-soft:#143640;--accent-line:#256A78;
  --ok:#4FC77A;--ok-soft:#12331F;--warn:#E9A93E;--warn-soft:#3A2A0F;--crit:#F27380;--crit-soft:#4A1E24;
  --info:#7FA6F0;--info-soft:#1D2C48;--violet:#B39DF0;--violet-soft:#2C2447;
  --shadow:0 12px 32px rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:15px}h3{font-size:13.5px}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:inline-block;vertical-align:middle}

/* shell */
.app{display:flex;flex-direction:column;height:100%}
.topbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;margin-right:6px;white-space:nowrap;line-height:1.1}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand .mark svg{width:16px;height:16px}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.facility{display:flex;align-items:center;gap:6px;padding:0 9px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.facility svg{width:15px;height:15px;color:var(--ink-3)}
.facility select{border:0;background:transparent;font:inherit;color:var(--ink);max-width:230px}
.gsearch{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink-3)}
.gsearch svg{width:15px;height:15px;flex:none}
.gsearch input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);outline:0;min-width:0}
.gsearch kbd{font:inherit;font-size:11px;padding:0 5px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink-3)}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;position:relative;color:var(--ink-2);padding:0}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.demo{font-size:11.5px;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:2px 7px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.body{flex:1;display:flex;min-height:0}
.nav{flex:none;width:214px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--accent-soft);color:var(--accent)}
.nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink-3);background:var(--surface-2);padding:1px 7px;border-radius:999px}
.nav a.active .cnt{background:var(--surface);color:var(--accent)}
.nav a .cnt.hot{color:var(--crit);background:var(--crit-soft)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.nav .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--ink-3);line-height:1.45}
.view{flex:1;min-width:0;overflow:auto;padding:18px 20px 48px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.94)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .count{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.field{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;color:var(--ink-2)}
.field input,.field select{border:0;background:transparent;font:inherit;color:var(--ink);outline:0;min-width:0}
.field input{width:210px}
.field.grow{flex:1;min-width:180px}
.field.grow input{width:100%}
.field svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none;color:var(--ink-2)}
.tog .sw{width:32px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog input:checked+.sw{background:var(--accent)}
.tog input:checked+.sw::after{transform:translateX(14px)}
.seg-ctl{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg-ctl button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg-ctl button.active{background:var(--ink);color:var(--surface)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.pill.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill .x{margin-left:4px;opacity:.7}

/* panels & layout */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 0;flex-wrap:wrap}
.panel-h .sub{font-size:12px;color:var(--ink-3)}
.panel-b{padding:10px 14px 14px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:1fr 1fr}
.g-32{grid-template-columns:3fr 2fr}
.g-23{grid-template-columns:2fr 3fr}
.g-13{grid-template-columns:1fr 3fr}
.mt{margin-top:14px}
.chart{width:100%;height:auto;display:block;font-size:11px;font-family:inherit}
.chart text{fill:var(--ink-3)}
.clg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.clg span{display:inline-flex;align-items:center;gap:5px}
.clg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.clg i.dash{height:0;border-top:2px dashed var(--crit)}

/* fleet strip + KPIs */
.strip{display:flex;height:38px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.strip .seg{height:100%;min-width:3px;cursor:pointer}
.strip .seg:hover{filter:brightness(1.1)}
.strip .seg+.seg{border-left:1px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.legend .it{display:flex;align-items:center;gap:7px;cursor:pointer}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend b{font-weight:600}
.legend .lb{color:var(--ink-3)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.kpi{padding:13px 16px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;cursor:pointer}
.kpi:hover{background:var(--surface-2)}
.kpi:nth-child(4n){border-right:0}
.kpi:nth-last-child(-n+4){border-bottom:0}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:2px}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.up{color:var(--ok)}.down{color:var(--crit)}.warnc{color:var(--warn)}
.kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--crit)}.kpi .d.warnc{color:var(--warn)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl-wrap.flat{border:0;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th .arr{font-size:10px;margin-left:3px}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
.num{text-align:right}
.muted{color:var(--ink-3)}
.two{line-height:1.25}
.two small{display:block;color:var(--ink-3);font-size:12px;font-weight:400}
.tag{font-weight:600;letter-spacing:.01em}
.link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.empty{padding:28px 14px;text-align:center;color:var(--ink-3);font-size:13px}

/* chips & stickers */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 7px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.stk{display:inline-block;min-width:96px;text-align:center;padding:1px 7px;border-radius:3px;font-size:11.5px;font-weight:600;border:1.5px solid;line-height:1.55;white-space:nowrap}
.stk.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.stk.due{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stk.over{border-color:var(--crit);color:var(--surface);background:var(--crit)}
.stk.na{border-color:var(--line-2);color:var(--ink-3);background:transparent}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.li:first-child{border-top:0}
.li .rail{width:3px;align-self:stretch;border-radius:2px;flex:none;background:var(--line-2)}
.li .rail.crit{background:var(--crit)}.li .rail.warn{background:var(--warn)}.li .rail.info{background:var(--info)}.li .rail.ok{background:var(--ok)}
.li .bd{min-width:0;flex:1}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;font-size:12.5px;color:var(--ink-3);white-space:nowrap;flex:none}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px;margin:0}
.dl div{min-width:0}
.dl dt{color:var(--ink-3);font-size:12px}
.dl dd{margin:1px 0 0;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink-3)}
.check{list-style:none;margin:0;padding:0;font-size:13px}
.check li{padding:5px 0 5px 22px;position:relative;border-top:1px solid var(--line)}
.check li:first-child{border-top:0}
.check li::before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:2px;border:1.5px solid var(--accent)}
.hint{font-size:12.5px;color:var(--ink-3)}
.note{padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.tl{list-style:none;margin:0;padding:0;font-size:13px}
.tl li{position:relative;padding:0 0 12px 18px;border-left:1.5px solid var(--line);margin-left:5px}
.tl li::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl li:last-child{padding-bottom:0}
.tl .w{font-size:12px;color:var(--ink-3)}
.sec{margin-bottom:20px}
.sec h3{margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 span{font-weight:400;color:var(--ink-3);font-size:12px}

/* drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(8,18,26,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:29}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dr-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dr-h>div{min-width:0;flex:1}
.dr-h h2{font-size:16px;line-height:1.3}
.dr-h .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.dr-h .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dr-b{flex:1;overflow:auto;padding:14px 16px}
.dr-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{padding:9px 10px;font-size:13px;font-weight:500;color:var(--ink-3);border:0;border-bottom:2px solid transparent;cursor:pointer;background:none;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:40;padding:16px;opacity:0;pointer-events:none;transition:opacity .15s;background:rgba(8,18,26,.4)}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.modal-h h2{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.form input,.form select,.form textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.form textarea{resize:vertical;min-height:70px}
.form .full{grid-column:1/-1;position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;display:none}
.sugg.show{display:block}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;font-size:13px;border-top:1px solid var(--line)}
.sugg button:first-child{border-top:0}
.sugg button:hover{background:var(--surface-2)}
.sugg small{display:block;color:var(--ink-3);font-size:12px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:92%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* calendar, kanban, recalls, integrations */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);font-size:11.5px;color:var(--ink-3);padding:6px 4px;text-align:center}
.cal .day{background:var(--surface);min-height:66px;padding:6px;font-size:12px;cursor:pointer;position:relative;min-width:0}
.cal .day.out{color:var(--ink-3);background:var(--surface-2)}
.cal .day .n{font-weight:500;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%}
.cal .day.today .n{background:var(--ink);color:var(--surface)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .day .c{margin-top:5px;display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.cal .day .c i{width:7px;height:7px;border-radius:2px;display:inline-block}
.cal .day .cnt{font-size:11px;color:var(--ink-2);font-weight:500}
.cal .day .cnt.down{color:var(--crit)}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-nav h2{flex:1}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:220px}
.kcol h3{display:flex;justify-content:space-between;padding:4px 6px 8px;font-size:13px}
.kcol h3 span{color:var(--ink-3);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
.kcard:hover{border-color:var(--line-2)}
.kcard .t{font-weight:500;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .m{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;margin-top:6px;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.alert .rail{background:var(--warn)}
.alert.crit .rail{background:var(--crit)}
.alert.quiet .rail{background:var(--line-2)}
.alert .in{padding:12px 14px 12px 4px;min-width:0}
.alert .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.alert .src{font-weight:600;color:var(--ink);padding:0 6px;border:1px solid var(--line-2);border-radius:4px;font-size:11.5px}
.alert h3{margin:6px 0 4px;font-size:14px}
.alert .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-top:8px;align-items:center}
.alert .meta b{font-weight:600}
.alert .foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.alert .more{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.alert.exp .more{display:block}
.rep-list .list{gap:2px}
.rep-list .li{padding:10px 12px;border-radius:8px;border:1px solid transparent;border-top-color:transparent}
.rep-list .li.active{background:var(--accent-soft);border-color:var(--accent-line)}
.rep-list .li .t{white-space:normal}
.int{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.int:first-child{border-top:0}
.int .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:11.5px;color:var(--ink-2)}
.int .s{font-size:12.5px;color:var(--ink-3)}
.int .rt{display:flex;align-items:center;gap:10px}
.mini-tbl td,.mini-tbl th{padding:6px 8px}

/* portal, users, contracts */
body.portal .topbar,body.portal .nav{display:none}
body.portal .view{padding:0}
.portal-wrap{min-height:100%;padding:24px 16px 48px}
.portal-card{max-width:660px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.portal-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.portal-head h1{font-size:20px}
.portal-body{padding:18px 22px 22px}
.radio{display:grid;gap:8px}
.radio label{display:flex;flex-direction:row;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin:3px 0 0;width:auto}
.radio small{display:block;color:var(--ink-3);margin-top:2px;font-size:12px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox input{flex:1;font:inherit;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:160px}
.perm{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;max-width:100%}
.perm:disabled{opacity:.6}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
.kpis.k3{grid-template-columns:1fr}
  .kpi:nth-child(4n){border-right:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-last-child(-n+4){border-bottom:1px solid var(--line)}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .g-2,.g-32,.g-23,.g-13{grid-template-columns:1fr}
}
@media (max-width:760px){
  .body{flex-direction:column}
  .nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:4px;overflow-x:auto;flex:none}
  .nav a{padding:6px 10px;font-size:13px}
  .nav a .cnt{margin-left:4px}
  .nav .sep,.nav .foot{display:none}
  .view{padding:12px 12px 40px}
  .topbar{padding:0 10px;gap:8px}
  .facility,.gsearch kbd,.avatar,.brand small{display:none}
  .gsearch{max-width:none}
  .form{grid-template-columns:1fr}
  .field input{width:150px}
  .stats{grid-template-columns:1fr 1fr}
  .int{grid-template-columns:auto 1fr}
  .int .rt{grid-column:1/-1;justify-content:flex-start}
  .kanban{grid-template-columns:repeat(5,240px)}
  .cal .day{min-height:56px;padding:4px}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ reports ============ */
const REPORTS=[
 {k:'cosr',t:'Cost of service ratio by category',s:'Annualized service cost against acquisition value'},
 {k:'compliance',t:'PM compliance summary',s:'Survey-ready view by risk class (EC.02.04.03)'},
 {k:'mtbf',t:'Reliability by model',s:'Failures, mean time between failures, turnaround'},
 {k:'replace',t:'Replacement planning',s:'Devices scoring highest on age, failures, and condition'},
 {k:'spend',t:'Repair spend trend',s:'Labor and parts by month'},
 {k:'contract',t:'Contract vs in-house',s:'Where the service dollars go'},

 {k:'recall',t:'Recall response log',s:'Every alert and how it was handled'}

function repContent(k){
  const K=computeKpis(),done=W6().filter(w=>w.completed),ann=365/182;
  if(k==='cosr'){
    const items=CATS.map(c=>{const as=ACTIVE.filter(a=>a.cat===c),acq=sum(as,a=>a.cost);const svc=sum(done.filter(w=>ASSET_BY[w.asset].cat===c),woCost)*ann+sum(as.filter(a=>a.sup==='OEM contract'),a=>a.cost*0.07)+sum(as.filter(a=>a.sup==='Third-party'),a=>a.cost*0.04);return{label:c,value:+(svc/acq*100).toFixed(1),marker:6,acq,svc};}).sort((a,b)=>b.value-a.value);
    return`<div class="stats" style="margin-bottom:14px"><div class="stat"><div class="v">${K.cosr.toFixed(1)}%</div><div class="l">fleet-wide, annualized</div></div><div class="stat"><div class="v">${moneyK(K.total)}</div><div class="l">annual service cost</div></div><div class="stat"><div class="v">${moneyK(K.acq)}</div><div class="l">acquisition value in service</div></div></div>${CH.hbars({items,fmt:v=>v.toFixed(1)+'%',rh:28,aria:'Cost of service ratio by category'})}<div class="hint" style="margin-top:8px">Red marker: 6% benchmark midpoint. Ratio = (in-house labor and parts + vendor time and materials + service contracts) ÷ acquisition value. Imaging and sterilization run high because of OEM contracts; that is normal, but the categories above the marker are where a contract renegotiation or an in-house training investment pays back fastest.</div>`;
  }
  if(k==='compliance'){
    const cls=['Life support','High','Medium','Low'];
    const rows=cls.map(r=>{const as=ACTIVE.filter(a=>a.risk===r),od=as.filter(a=>dayDiff(TODAY,a.nextPM)<0).length;const pm=WOS.filter(w=>w.type==='Preventive maintenance'&&ASSET_BY[w.asset].risk===r&&w.due.getMonth()===TODAY.getMonth()&&w.due.getFullYear()===TODAY.getFullYear());const dn=pm.filter(w=>w.completed).length,ot=pm.filter(w=>w.completed&&!w.late).length;const cur=(1-od/as.length)*100;
      return`<tr><td>${riskChip(r)}</td><td class="num">${as.length}</td><td class="num">${pm.length}</td><td class="num">${dn}</td><td class="num">${ot}</td><td class="num ${od?'down':''}">${od}</td><td class="num ${cur>=(r==='Low'||r==='Medium'?95:100)?'up':'down'}"><b>${cur.toFixed(1)}%</b></td><td class="muted">${r==='Life support'||r==='High'?'100%':'95%'}</td></tr>`;}).join('');
    return`<div class="tbl-wrap"><table><thead><tr><th>Risk class</th><th class="num">Devices</th><th class="num">PMs due this month</th><th class="num">Completed</th><th class="num">On time</th><th class="num">Overdue now</th><th class="num">Current compliance</th><th>Target</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note" style="margin-top:12px">Compliance here means the share of active devices whose PM is not past due today. High-risk and life-support equipment must be at 100% at the time of survey; other equipment follows the hospital policy target of 95% with completion within the due month. Devices that cannot be located for PM are listed separately in the missing-equipment report and are not counted as compliant.</div><div style="margin-top:12px">${pmTrendChart(TODAY.getFullYear(),TODAY.getMonth(),170)}</div>`;
  }
  if(k==='mtbf'){
    const rows=MODELS.map(m=>{const as=ACTIVE.filter(a=>a.mid===m.id);const reps=W6().filter(w=>w.type==='Corrective repair'&&ASSET_BY[w.asset].mid===m.id);const dn=reps.filter(w=>w.completed);const mtbf=reps.length?as.length*182/reps.length:null;return{m,n:as.length,reps:reps.length,mtbf,tt:dn.length?sum(dn,w=>w.turnaround)/dn.length:0,cost:dn.length?sum(dn,woCost)/dn.length:0,rate:as.length?reps.length/as.length*2:0};}).filter(r=>r.reps>0).sort((a,b)=>b.rate-a.rate).slice(0,12);
    return`<div class="tbl-wrap"><table><thead><tr><th>Model</th><th class="num">In service</th><th class="num">Repairs, 6 mo</th><th class="num">Repairs per device per year</th><th class="num">MTBF, days</th><th class="num">Avg turnaround</th><th class="num">Avg repair cost</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="two">${esc(r.m.mfr)} ${esc(r.m.model)}<small>${esc(r.m.name)}</small></td><td class="num">${r.n}</td><td class="num">${r.reps}</td><td class="num ${r.rate>1?'down':''}">${r.rate.toFixed(2)}</td><td class="num">${r.mtbf?Math.round(r.mtbf).toLocaleString():'—'}</td><td class="num">${r.tt.toFixed(1)} d</td><td class="num">${money(r.cost)}</td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin-top:8px">Ranked by repairs per device per year. MTBF is fleet-level: device-days in the period divided by repairs. Models above one repair per device per year are the first place to look for a training issue, an accessory problem, or an aging fleet.</div>`;
  }
  if(k==='replace'){
    const scored=ACTIVE.map(a=>{const age=dayDiff(a.installed,TODAY)/365.25,reps=W6().filter(w=>w.type==='Corrective repair'&&w.asset===a.id).length;const score=0.5*Math.min(age/a.life,1.5)/1.5+0.3*Math.min(reps/3,1)+0.2*(5-a.cond)/4;return{a,age,reps,score};}).sort((x,y)=>y.score-x.score).slice(0,12);
    const total=sum(scored,s=>MODEL_BY[s.a.mid].cost*1.05);
    return`<div class="hint" style="margin-bottom:10px">Score weighs age against expected life (50%), repairs in the last six months (30%), and condition (20%). The top twelve are shown; the full list feeds the capital request.</div><div class="tbl-wrap"><table><thead><tr><th>Asset</th><th>Location</th><th class="num">Age</th><th class="num">Expected life</th><th class="num">Repairs, 6 mo</th><th>Condition</th><th class="num">Score</th><th class="num">Est. replacement</th></tr></thead><tbody>${scored.map(({a,age,reps,score})=>`<tr class="row" data-asset="${a.id}"><td class="two"><span class="tag">${a.id}</span> ${esc(a.name)}<small>${esc(a.mfr)} ${esc(a.model)}</small></td><td>${esc(a.dept)}</td><td class="num ${age>a.life?'down':''}">${age.toFixed(1)} yr</td><td class="num">${a.life} yr</td><td class="num">${reps}</td><td>${a.cond} of 5</td><td class="num"><b>${(score*100).toFixed(0)}</b></td><td class="num">${money(MODEL_BY[a.mid].cost*1.05)}</td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin-top:8px">Estimated replacement total for these twelve: <b style="color:var(--ink)">${money(total)}</b> at current list price plus 5%.</div>`;
  }
  if(k==='spend'){
    const mb=monthBuckets(6);const lab=mb.map(({y,m})=>sum(WOS.filter(w=>w.type==='Corrective repair'&&w.completed&&w.completed.getMonth()===m&&w.completed.getFullYear()===y),w=>w.labor.cost)),parts=mb.map(({y,m})=>sum(WOS.filter(w=>w.type==='Corrective repair'&&w.completed&&w.completed.getMonth()===m&&w.completed.getFullYear()===y),w=>w.parts.cost));
    return`<div class="stats" style="margin-bottom:14px"><div class="stat"><div class="v">${moneyK(K.mtd)}</div><div class="l">month to date (partial month)</div></div><div class="stat"><div class="v">${moneyK(sum(lab)+sum(parts))}</div><div class="l">last 6 months</div></div><div class="stat"><div class="v">${moneyK((sum(lab)+sum(parts))/6)}</div><div class="l">monthly average</div></div></div>${CH.bars({labels:mb.map(x=>x.label),series:[{name:'Labor',values:lab.map(Math.round),color:'var(--accent)'},{name:'Parts',values:parts.map(Math.round),color:'var(--warn)'}],fmt:moneyK,aria:'Repair spend by month'})}<div class="hint" style="margin-top:8px">Repair work orders only; PM labor and service contracts are excluded. The current month is partial.</div>`;
  }
  if(k==='contract'){
    const rows=['In-house','OEM contract','Third-party'].map(s=>{const as=ACTIVE.filter(a=>a.sup===s),acq=sum(as,a=>a.cost);const svc=sum(done.filter(w=>ASSET_BY[w.asset].sup===s),woCost)*ann+(s==='OEM contract'?acq*0.07:s==='Third-party'?acq*0.04:0);return{s,n:as.length,acq,svc};});
    return`${CH.donut({items:[{label:'In-house labor and parts',value:Math.round(K.inhouse),color:'var(--accent)',fmt:moneyK(K.inhouse)},{label:'Vendor time and materials',value:Math.round(K.vendorTM),color:'var(--warn)',fmt:moneyK(K.vendorTM)},{label:'Service contracts',value:Math.round(K.contracts),color:'var(--violet)',fmt:moneyK(K.contracts)}],center:moneyK(K.total),centerLabel:'per year',aria:'Service spend by source'})}<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Support model</th><th class="num">Devices</th><th class="num">Acquisition value</th><th class="num">Annual cost</th><th class="num">Ratio</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s}</td><td class="num">${r.n.toLocaleString()}</td><td class="num">${moneyK(r.acq)}</td><td class="num">${moneyK(r.svc)}</td><td class="num">${(r.svc/r.acq*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin-top:8px">Contract cost is modeled at 7% of acquisition value for OEM contracts and 4% for third-party agreements; in a live system it comes from the contract records in Settings.</div>`;
  }
  if(k==='tech'){
    const d30=addDays(TODAY,-30);
    const rows=TECHS.map(t=>{const mine=WOS.filter(w=>w.tech===t.name&&w.completed&&w.completed>=d30&&!w.batch);const pm=mine.filter(w=>w.type==='Preventive maintenance'),rep=mine.filter(w=>w.type==='Corrective repair');return{t,n:mine.length,pm:pm.length,rep:rep.length,hrs:sum(mine,w=>w.labor.hrs),ot:pm.length?pm.filter(w=>!w.late).length/pm.length*100:100,tt:rep.length?sum(rep,w=>w.turnaround)/rep.length:0,open:WOS.filter(w=>w.tech===t.name&&isOpen(w)&&!w.batch).length};});
    return`${CH.hbars({items:rows.map(r=>({label:r.t.name,value:r.n})),rh:28,aria:'Work orders closed by technician'})}<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Technician</th><th class="num">Closed</th><th class="num">PMs</th><th class="num">Repairs</th><th class="num">Hours logged</th><th class="num">PM on time</th><th class="num">Avg repair turnaround</th><th class="num">Open now</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="two">${esc(r.t.name)}<small>${r.t.role}</small></td><td class="num">${r.n}</td><td class="num">${r.pm}</td><td class="num">${r.rep}</td><td class="num">${r.hrs.toFixed(1)}</td><td class="num ${r.ot>=95?'up':'down'}">${r.ot.toFixed(0)}%</td><td class="num">${r.tt.toFixed(1)} d</td><td class="num">${r.open}</td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin-top:8px">Vendor-performed work is excluded. Hours are as logged on work orders, not badge time.</div>`;
  }
  if(k==='recall'){
    return`<div class="tbl-wrap"><table><thead><tr><th>Received</th><th>Alert</th><th>Device</th><th class="num">Affected</th><th>Status</th><th>Response</th></tr></thead><tbody>${RECALLS.slice().sort((a,b)=>b.date-a.date).map(r=>{const n=matchedAssets(r).length;const resp=r.status==='Closed'?esc(r.closedNote||'Closed'):r.status==='No fleet match'?'Reviewed, no devices affected':r.status==='Action in progress'?`${r.progress||0} of ${r.total||n} devices completed`:`Open ${dayDiff(r.date,TODAY)} d`;return`<tr><td class="muted">${fmtShort(r.date)}</td><td class="two"><span class="tag">${r.id}</span><small>${r.src} · ${r.cls}</small></td><td class="two">${esc(r.model)}<small>${esc(r.mfr)}</small></td><td class="num">${n}</td><td>${rcChip(r.status)}</td><td style="white-space:normal;min-width:220px">${resp}</td></tr>`;}).join('')}</tbody></table></div><div class="hint" style="margin-top:8px">This log is what a surveyor asks for: when the alert arrived, how many devices it touched, and what was done. Each row links to the work orders that closed it.</div>`;
  }
  return'<div class="empty">Report preview not built in this mock.</div>';
}

/* ============ contracts ============ */
function ctStatus(c){const d=dayDiff(TODAY,c.end);if(d<0)return{k:'crit',t:'Expired '+fmtShort(c.end),s:'expired'};if(d<=90)return{k:'warn',t:`Ends in ${d} d`,s:'ending'};if(c.start>TODAY)return{k:'info',t:'Starts '+fmtShort(c.start),s:'active'};return{k:'ok',t:'Active',s:'active'};}
function ctModels(c){const m={};contractDevices(c).forEach(a=>{const k=`${a.mfr} ${a.model}`;m[k]=(m[k]||0)+1;});return Object.entries(m).sort((x,y)=>y[1]-x[1]);}
const ctTypeChip=c=>c.type==='OEM'?'<span class="chip acc">OEM</span>':'<span class="chip neutral">Third-party</span>';
function ctFiltered(){const f=state.ct,q=f.q.trim().toLowerCase();return CONTRACTS.filter(c=>{if(f.type&&c.type!==f.type)return false;if(f.status&&ctStatus(c).s!==f.status)return false;if(q){const models=ctModels(c).map(x=>x[0]).join(' ').toLowerCase();if(!(c.ref.toLowerCase().includes(q)||c.vendor.toLowerCase().includes(q)||c.coverage.toLowerCase().includes(q)||models.includes(q)))return false;}return true;}).sort((x,y)=>x.end-y.end);}
function ctTable(){const list=ctFiltered();
  const rows=list.map(c=>{const devs=contractDevices(c),models=ctModels(c),st=ctStatus(c);const cov=models.slice(0,2).map(x=>esc(x[0])).join(', ')+(models.length>2?` +${models.length-2} more`:'');
    return`<tr class="row" data-contract="${c.id}"><td class="two"><span class="tag">${esc(c.ref)}</span><small>${esc(c.coverage)}</small></td><td>${esc(c.vendor)}</td><td>${ctTypeChip(c)}</td><td style="white-space:normal;min-width:180px">${cov||'<span class="muted">No devices yet</span>'}</td><td class="num">${devs.length}</td><td class="num">${moneyK(c.annual)}</td><td class="muted">${fmtMY(c.start)} to ${fmtMY(c.end)}</td><td><span class="chip ${st.k}">${st.t}</span></td></tr>`;}).join('');
  return`<div class="tbl-wrap"><table><thead><tr><th>Contract</th><th>Vendor</th><th>Type</th><th>Covers</th><th class="num">Devices</th><th class="num">Annual cost</th><th>Term</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="8"><div class="empty">No contracts match these filters.</div></td></tr>'}</tbody></table></div>`;}
function vContracts(){const f=state.ct,covered=ACTIVE.filter(underContract).length,annual=sum(CONTRACTS.filter(c=>c.end>=TODAY),c=>c.annual),expired=CONTRACTS.filter(c=>c.end<TODAY),ending=CONTRACTS.filter(c=>{const d=dayDiff(TODAY,c.end);return d>=0&&d<=90;});

  <div class="kpis k3"><div class="kpi" style="cursor:default"><div class="l">Annual contract spend</div><div class="v">${moneyK(annual)}</div><div class="d">active contracts · ${(annual/sum(ACTIVE,a=>a.cost)*100).toFixed(1)}% of acquisition value</div></div><div class="kpi" style="cursor:default"><div class="l">Devices under contract</div><div class="v">${covered.toLocaleString()}</div><div class="d">${(covered/ACTIVE.length*100).toFixed(1)}% of the active fleet</div></div><div class="kpi" style="cursor:default"><div class="l">Need a renewal decision</div><div class="v">${expired.length+ending.length}</div><div class="d">${expired.length} expired · ${ending.length} ending within 90 days · ${sum(expired,c=>contractDevices(c).length)} devices no longer covered</div></div></div>
  <div class="toolbar"><label class="field grow">${I.search}<input data-f="ct.q" value="${esc(f.q)}" placeholder="Search reference, vendor, model, coverage" aria-label="Search contracts"></label>${sel('type','Type',[['OEM','OEM'],['Third-party','Third-party']])}${sel('status','Status',[['active','Active'],['ending','Ending within 90 days'],['expired','Expired']])}</div>

function ctFields(c){return`<div class="form">

</div>`;}
function ctList(c){const devs=contractDevices(c).sort((x,y)=>x.model.localeCompare(y.model)||x.id.localeCompare(y.id)),q=(state.drawer.q||'').trim().toLowerCase();
  const shown=q?devs.filter(a=>a.id.toLowerCase().includes(q)||a.model.toLowerCase().includes(q)||a.dept.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)):devs;

function drawerContract(c){const devs=contractDevices(c),st=ctStatus(c),models=ctModels(c),perDev=devs.length?c.annual/devs.length:0;
  const addModel=MODELS.map(m=>{const n=ACTIVE.filter(a=>a.mid===m.id&&a.contract!==c).length;return n?`<option value="${m.id}">${esc(m.mfr)} ${esc(m.model)} · ${n} not on this contract</option>`:'';}).join('');

    :`<div class="sec"><dl class="dl"><div><dt>Vendor</dt><dd>${esc(c.vendor)}</dd></div><div><dt>Type</dt><dd>${c.type==='OEM'?'OEM service contract':'Third-party service agreement'}</dd></div><div><dt>Coverage</dt><dd>${esc(c.coverage)}</dd></div><div><dt>Term</dt><dd>${fmtDate(c.start)} to ${fmtDate(c.end)}</dd></div><div><dt>Annual cost</dt><dd>${money(c.annual)}</dd></div><div><dt>Per covered device</dt><dd>${devs.length?money(perDev)+' per year':'—'}</dd></div><div><dt>Notes</dt><dd>${esc(c.notes)||'—'}</dd></div><div><dt>Status</dt><dd><span class="chip ${st.k}">${st.t}</span></dd></div></dl><div style="margin-top:10px"><span class="link" data-act="ct-edit">Edit contract</span></div></div>`;
  return`<div class="dr-h"><div><h2>${esc(c.ref)} · ${esc(c.vendor)}</h2><div class="sub">${esc(c.coverage)} · ${models.map(x=>esc(x[0])).join(', ')||'no devices yet'}</div><div class="chips">${ctTypeChip(c)}<span class="chip ${st.k}">${st.t}</span><span class="chip neutral">${devs.length} device${devs.length===1?'':'s'}</span></div></div><button class="iconbtn" data-act="close" aria-label="Close">${I.x}</button></div>
  <div class="dr-b">${details}
    <div class="sec"><h3>Add covered devices</h3><div class="form" style="padding:0;grid-template-columns:1fr">

    </div><div class="hint" style="margin-top:6px">A device can be on one contract at a time. Adding it here moves it and sets its support type to ${c.type==='OEM'?'OEM contract':'third-party'}.</div></div>

function openContractModal(attach){const a=attach?ASSET_BY[attach]:null;state.modal={ctNew:true,attach:a?a.id:null};const c={ref:'',vendor:a?(CONTRACT_VENDOR[a.mfr]||a.mfr):'',type:'OEM',coverage:'Full service',start:TODAY,end:addMonths(TODAY,12),annual:a?Math.round(a.cost*0.07/100)*100:0,notes:''};
  $('#modal-card').innerHTML=`<div class="modal-h"><h2>New service contract</h2><button class="iconbtn" data-act="close-modal" aria-label="Close">${I.x}</button></div>${ctFields(c)}<div class="hint" style="padding:0 16px 12px">${a?`${a.id} · ${esc(a.name)} will be added to this contract.`:'Add covered devices after the contract is created, one at a time or by model.'}</div><div class="modal-f"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="ct-create">Create contract</button></div>`;showModal();setTimeout(()=>{const f=$('#ct-ref');if(f)f.focus();},50);}
function createContract(){const f=readCtFields();if(!f.ref||!f.vendor){toast('Reference and vendor are required');return;}const c={id:'ct'+Date.now(),...f};CONTRACTS.push(c);const attach=state.modal&&state.modal.attach;if(attach&&ASSET_BY[attach])linkContract(ASSET_BY[attach],c);closeModal();if(state.drawer)closeDrawer();toast(`${c.ref} created`);if(state.view!=='contracts')go('contracts');else render();openContract(c.id);}
function saveContract(id){const c=ctById(id);if(!c)return;const f=readCtFields();if(!f.ref||!f.vendor){toast('Reference and vendor are required');return;}Object.assign(c,f);contractDevices(c).forEach(a=>linkContract(a,c));state.drawer.edit=false;toast(`${c.ref} updated`);renderDrawer();render();}
function deleteContract(id){const c=ctById(id);if(!c)return;const devs=contractDevices(c);devs.forEach(a=>linkContract(a,null));CONTRACTS.splice(CONTRACTS.indexOf(c),1);closeDrawer();toast(`${c.ref} deleted; ${devs.length} device${devs.length===1?'':'s'} set to in-house support`);render();}
function renewContract(id){const c=ctById(id);if(!c)return;c.end=addMonths(c.end<TODAY?TODAY:c.end,12);if(c.start>TODAY)c.start=TODAY;toast(`${c.ref} renewed through ${fmtDate(c.end)}`);renderDrawer();render();}
function addModelToContract(id){const c=ctById(id),sel=$('#ct-model');if(!c||!sel||!sel.value)return;const list=ACTIVE.filter(a=>a.mid===sel.value&&a.contract!==c);list.forEach(a=>linkContract(a,c));toast(`${list.length} device${list.length===1?'':'s'} added to ${c.ref}`);renderDrawer();render();}
function addDeviceToContract(c,a){const prev=a.contract;linkContract(a,c);toast(prev&&prev!==c?`${a.id} moved from ${prev.ref} to ${c.ref}`:`${a.id} added to ${c.ref}`);renderDrawer();render();}
function removeFromContract(id,asset){const c=ctById(id),a=ASSET_BY[asset];if(!c||!a)return;linkContract(a,null);toast(`${a.id} removed from ${c.ref}`);renderDrawer();render();}

const userChip=s=>`<span class="chip ${({'Active':'ok','Invited':'info','Deactivated':'neutral'})[s]||'neutral'}">${s}</span>`;
const roleName=id=>(ROLES.find(r=>r.id===id)||{}).name||id;

  return`<div class="tbl-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Department</th><th>Status</th><th>Last active</th><th>Credentials</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7"><div class="empty">No users match.</div></td></tr>'}</tbody></table></div>`;}

function rolesTab(){return`<div class="tbl-wrap"><table><thead><tr><th>Role</th>${MODULES.map(([k,l])=>`<th>${l}</th>`).join('')}<th class="num">Users</th></tr></thead><tbody>${ROLES.map(r=>`<tr><td class="two" style="white-space:normal;min-width:220px"><b style="font-weight:600">${esc(r.name)}</b><small>${esc(r.desc)}</small></td>${MODULES.map(([k])=>`<td><select class="perm" data-perm="${r.id}.${k}" aria-label="${esc(r.name)}, ${k}"${r.id==='director'?' disabled':''}>${PERM_LEVELS.map(l=>`<option${r.perms[k]===l?' selected':''}>${l}</option>`).join('')}</select></td>`).join('')}<td class="num">${USERS.filter(u=>u.role===r.id&&u.status!=='Deactivated').length}</td></tr>`).join('')}</tbody></table></div>
  <div class="note" style="margin-top:12px">None hides the module. View is read-only. Request lets a user submit and follow their own requests. Edit allows creating and updating records. Approve adds sign-off actions: closing recalls, approving AEM changes, closing other people's work orders. Full adds configuration. The Director role is fixed; changes to other roles apply at the next sign-in.</div>`;}
function coverageRows(){return CATS.map(c=>{const n=ACTIVE.filter(a=>a.cat===c).length,models=MODELS.filter(m=>m.cat===c);

  return{c,n,who,contract:models.some(m=>m.sup==='OEM contract')};}).sort((a,b)=>a.who.filter(w=>w.full).length-b.who.filter(w=>w.full).length||b.n-a.n);}
function credsTab(){const sel=state.users.tech,techs=sel?TECHS.filter(t=>t.id===sel):TECHS,cov=coverageRows();

   <div>${techs.map(t=>{const cs=CREDS.filter(c=>c.tech===t.id).sort((a,b)=>a.scope.localeCompare(b.scope)||a.value.localeCompare(b.value));return`<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h2>${esc(t.name)} <span class="muted" style="font-weight:400">· ${esc(t.role)}${t.cert&&t.cert!=='—'?` · ${esc(t.cert)}`:''}</span></h2><span class="sub">${cs.filter(c=>c.status!=='In training').length} active credentials</span></div><div class="tbl-wrap flat" style="margin-top:6px"><table class="mini-tbl"><thead><tr><th>Scope</th><th>Covers</th><th>Source</th><th>Issued</th><th>Status</th><th></th></tr></thead><tbody>${cs.map(c=>{const st=credState(c);return`<tr><td class="muted">${c.scope}</td><td style="font-weight:500">${esc(c.value)}</td><td class="muted" style="white-space:normal;min-width:160px">${esc(c.src)}</td><td class="muted">${fmtMY(c.issued)}</td><td><span class="chip ${st.k}">${st.t}</span></td><td class="num" style="white-space:nowrap">${c.expires&&c.status!=='In training'?`<button class="btn sm ghost" data-act="cred-renew" data-id="${c.id}">Renew</button>`:c.status==='In training'?`<button class="btn sm ghost" data-act="cred-activate" data-id="${c.id}">Sign off</button>`:''}<button class="btn sm ghost" data-act="cred-remove" data-id="${c.id}">Remove</button></td></tr>`;}).join('')||'<tr><td colspan="6"><div class="empty">No credentials on file.</div></td></tr>'}</tbody></table></div></div>`;}).join('')}${sel?`<div class="hint"><span class="link" data-act="utab" data-utab-to="creds">Show all technicians</span></div>`:''}</div>

function pmHistory(a){const out=[];let d=a.lastPM;for(let i=0;i<4&&d;i++){if(d<a.installed)break;const h=hash(a.id+i);out.push({d,tech:TECHS[h%TECHS.length].name,result:h%17===0?'Fail, repair work order opened':h%9===0?'Pass with minor repair':'Pass',hrs:libFor(a).hrs});d=addMonths(d,-a.pm);}return out;}
function replaceNote(a){const age=dayDiff(a.installed,TODAY)/365.25,left=a.life-age;const est=money(MODEL_BY[a.mid].cost*1.05);return left<=0?`Past expected life by ${(-left).toFixed(1)} years. On the replacement candidate list; estimated replacement ${est}.`:left<=1.5?`Within ${left.toFixed(1)} years of expected end of life. Flag for the next capital cycle; estimated replacement ${est}.`:`About ${left.toFixed(1)} years of expected life remaining. No replacement action needed.`;}
function contractChip(a){if(!a.contract)return'';const d=dayDiff(TODAY,a.contract.end);if(d<0)return`<span class="chip warn">Contract expired</span>`;if(d<=90)return`<span class="chip warn">Contract ends ${fmtShort(a.contract.end)}</span>`;return`<span class="chip acc">Under contract</span>`;}
function qualChip(tech,a){if(!tech||tech==='Unassigned')return`<span class="chip warn">Unassigned</span>`;if(/service/i.test(tech))return`<span class="chip neutral">Vendor</span>`;const q=qualFor(tech,a);if(!q)return'';if(!q.ok)return`<span class="chip crit">Not credentialed for this device</span>`;if(q.soon)return`<span class="chip warn">Credential expires in ${dayDiff(TODAY,q.expires)} d</span>`;return`<span class="chip ok">Credentialed, ${esc(q.via)}</span>`;}
function techOptions(a,current){const rows=TECHS.map(t=>{const q=a?qualFor(t,a):null;return{t,q,rank:q?(q.ok?(q.soon?1:0):2):1};}).sort((x,y)=>x.rank-y.rank||x.t.name.localeCompare(y.t.name));

    body=`${state.drawer.editSupport?supportForm(a):''}<div class="sec"><dl class="dl">

function drawerWo(w){

  const tl=[{t:w.opened,who:w.requester,text:`Opened${w.source==='portal'?' from the service request portal':''}: ${w.problem}`}];

  if(w.status==='Awaiting parts')tl.push({t:w.started||w.opened,who:w.tech,text:'Waiting on parts'});

  if(w.status==='Closed')tl.push({t:addDays(w.completed,1)>TODAY?TODAY:addDays(w.completed,1),who:'Dana Whitfield',text:'Reviewed and closed'});
  w.notes.forEach(n=>tl.push(n));
  return`<div class="dr-h"><div><h2>${w.id} · ${w.type}</h2><div class="sub"><span class="link" data-asset="${a.id}">${a.id}</span> · ${esc(a.name)}, ${esc(a.mfr)} ${esc(a.model)} · ${esc(a.dept)}</div><div class="chips">${prioChip(w.priority)}${woChip(w.status)}${late?`<span class="chip crit">${dayDiff(w.due,TODAY)} d past due</span>`:''}${w.vendor?'<span class="chip violet">Vendor</span>':''}${w.source==='portal'?'<span class="chip acc">Portal request</span>':''}</div></div><button class="iconbtn" data-act="close" aria-label="Close">${I.x}</button></div>
  <div class="dr-b">
    <div class="sec"><dl class="dl"><div><dt>Requested by</dt><dd>${esc(w.requester)}</dd></div><div><dt>Assigned to</dt><dd>${un?'':esc(w.tech)+' '}${qualChip(w.tech,a)}</dd></div><div><dt>Opened</dt><dd>${fmtDate(w.opened)}</dd></div><div><dt>Due</dt><dd class="${late?'down':''}">${fmtDate(w.due)}</dd></div><div><dt>Completed</dt><dd>${fmtDate(w.completed)}</dd></div><div><dt>${isOpen(w)?'Open for':'Turnaround'}</dt><dd>${isOpen(w)?dayDiff(w.opened,TODAY):w.turnaround} days${w.downtime?` · ${w.downtime} d downtime`:''}</dd></div>${w.source==='portal'?`<div><dt>Callback</dt><dd>${esc(w.contact||'Not given')}</dd></div><div><dt>Reported location</dt><dd>${esc(w.room||a.dept)}${w.tagged?' · tagged out by the unit':''}</dd></div>`:''}</dl></div>
    ${isOpen(w)?`<div class="sec"><h3>Assignment <span>${esc(POLICY.assign)}</span></h3><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="assign-sel" class="perm" style="flex:1;min-width:220px;padding:7px 9px" aria-label="Assign to">${techOptions(a,un?null:w.tech)}</select><button class="btn sm primary" data-act="wo-assign" data-id="${w.id}">${un?'Assign':'Reassign'}</button></div></div>`:''}
    <div class="sec"><h3>Problem</h3><div>${esc(w.problem)}</div></div>
    ${w.resolution?`<div class="sec"><h3>Resolution</h3><div>${esc(w.resolution)}</div></div>`:''}
    <div class="sec"><h3>Cost <span>${isOpen(w)?'estimate':'actual'}</span></h3><div class="stats"><div class="stat"><div class="v">${w.labor.hrs} h</div><div class="l">labor at ${money(w.labor.rate)}/h · ${money(w.labor.cost)}</div></div><div class="stat"><div class="v">${money(w.parts.cost)}</div><div class="l">parts${w.parts.items.length?` · ${w.parts.items.length} line${w.parts.items.length>1?'s':''}`:''}</div></div><div class="stat"><div class="v">${money(woCost(w))}</div><div class="l">total</div></div></div></div>
    <div class="sec"><h3>Timeline</h3><ul class="tl">${tl.map(e=>`<li><div>${esc(e.text)}</div><div class="w">${fmtDate(e.t)} · ${esc(e.who)}</div></li>`).join('')}</ul>
      <div style="display:flex;gap:8px;margin-top:12px"><input id="note-in" placeholder="Add a note" aria-label="Add a note" style="flex:1;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;min-width:0"><button class="btn sm" data-act="wo-note" data-id="${w.id}">Add</button></div></div>
  </div>

}

function suggestInto(q,boxId,target){const box=document.getElementById(boxId);if(!box)return;if(target==='modal'&&state.modal)state.modal.asset=null;if(target==='portal'&&state.portal)state.portal.asset=null;q=q.trim().toLowerCase();if(q.length<2){box.classList.remove('show');return;}

function setWoStatus(id,status){
  const w=WOS.find(x=>x.id===id);if(!w)return;const prev=w.status;w.status=status;
  if(status==='In progress'&&!w.started)w.started=TODAY;
  if(status==='In progress'&&(prev==='Closed'||prev==='Completed')){w.completed=null;w.turnaround=0;}
  if(status==='Completed'){w.completed=TODAY;w.turnaround=dayDiff(w.opened,TODAY);w.downtime=w.type==='Corrective repair'?w.turnaround:0;w.late=TODAY>w.due;
    if(!w.resolution)w.resolution=w.type==='Preventive maintenance'?'PM completed, all checks passed':w.type==='Recall action'?'Recall action completed and documented':'Repaired and verified, returned to service';
    const a=ASSET_BY[w.asset];if(w.type==='Preventive maintenance'){a.lastPM=TODAY;a.nextPM=addMonths(TODAY,libFor(a).aem||a.pm);}if((a.status==='In repair'||a.status==='Out of service')&&w.type==='Corrective repair')a.status='In service';}
  w.notes.push({t:TODAY,who:'Kim Alvarez',text:`Status changed to ${status.toLowerCase()}`});

  const as=el.closest('[data-asset]');if(as){openAsset(as.dataset.asset);return;}
  const ctr=el.closest('[data-contract]');if(ctr){openContract(ctr.dataset.contract);return;}
  const bk=el.closest('[data-bucket]');if(bk){state.eq=resetEq({bucket:bk.dataset.bucket});go('equipment');return;}
  const nav=el.closest('[data-nav]');if(nav){e.preventDefault();if(nav.dataset.bucketNav)state.eq=resetEq({bucket:nav.dataset.bucketNav});if(nav.dataset.repNav)state.rep=nav.dataset.repNav;if(state.drawer)closeDrawer();go(nav.dataset.nav);return;}
  const th=el.closest('th.sort');if(th){const k=th.dataset.sort;if(state.eq.sort===k)state.eq.dir*=-1;else{state.eq.sort=k;state.eq.dir=1;}state.eq.page=1;$('#eq-table').innerHTML=eqTable();return;}
  const day=el.closest('[data-day]');if(day){state.pm.sel=day.dataset.day;render();return;}
  const pill=el.closest('[data-pill]');if(pill){state.rc=pill.dataset.pill;render();return;}
  const rep=el.closest('[data-rep]');if(rep){state.rep=rep.dataset.rep;render();return;}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.type!=='checkbox'&&t.tagName!=='SELECT')setFilter(t.dataset.f,t.value);if(t.id==='nw-asset')suggestInto(t.value,'nw-sugg','modal');if(t.id==='pr-asset')suggestInto(t.value,'pr-sugg','portal');if(t.id==='ct-asset')suggestInto(t.value,'ct-sugg','contract');if(t.id==='ct-filter'&&state.drawer&&state.drawer.type==='contract'){state.drawer.q=t.value;const c=ctById(state.drawer.id),el=$('#ct-list');if(c&&el)el.innerHTML=ctList(c);}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f&&(t.type==='checkbox'||t.tagName==='SELECT'))setFilter(t.dataset.f,t.type==='checkbox'?t.checked:t.value);
  if(t.id==='facility')toast(`Showing ${t.value}. All facilities share this demo data.`);
  if(t.dataset.pset){const k=t.dataset.pset;PORTAL_SET[k]=t.type==='checkbox'?t.checked:t.value;persistPolicy();const lab=t.closest('label.tog');if(lab){const txt=lab.lastChild;if(txt&&txt.nodeType===3)txt.textContent=PORTAL_SET[k]?'On':'Off';}toast('Portal setting saved');}
  if(t.id==='share-dept'){const i=$('#share-dept-link');if(i)i.value=BASE_URL()+'#request?dept='+encodeURIComponent(t.value);}
  if(t.dataset.userRole){const u=USERS.find(x=>x.id===t.dataset.userRole);if(u){u.role=t.value;toast(`${u.name}: role set to ${roleName(u.role)}`);}}
  if(t.dataset.perm){const [rid,mod]=t.dataset.perm.split('.');const r=ROLES.find(x=>x.id===rid);if(r){r.perms[mod]=t.value;const md=MODULES.find(x=>x[0]===mod);toast(`${r.name}: ${md?md[1]:mod} set to ${t.value}`);}}
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key==='Escape'){if($('#modal').classList.contains('open'))closeModal();else closeDrawer();return;}
  if(e.key==='/'&&!typing&&!state.portal){e.preventDefault();$('#gsearch').focus();return;}
  if(e.key==='Enter'&&e.target.id==='gsearch'){const q=e.target.value.trim();if(!q)return;const w=WOS.find(x=>x.id.toLowerCase()===q.toLowerCase());if(w){openWo(w.id);return;}const a=ASSET_BY[q.toUpperCase()];if(a){openAsset(a.id);return;}state.eq=resetEq({q});go('equipment');return;}
  if(e.key==='Enter'&&!typing){const d=e.target.closest&&e.target.closest('[data-day]');if(d){state.pm.sel=d.dataset.day;render();}}
});
let lastCW=CW(),rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(CW()!==lastCW){lastCW=CW();render();}},150);});
try{const t=localStorage.getItem('cadence-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
(function init(){setThemeIcon();const r=routeParams();
  if(r.route==='request'){document.body.classList.add('portal');const a=ASSET_BY[r.asset];state.portal={dept:DEPTS.includes(r.dept)?r.dept:(a?a.dept:''),asset:a?a.id:'',done:null};renderPortal();return;}
  loadRequests();if(VIEWS[r.route])state.view=r.route;render();})();
</script>
</body>
</html>
