<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Request equipment service{% endblock %} · {{ tenant.name }}</title>
<style>
  :root{--bg:#EDF1F4;--surface:#fff;--ink:#14212B;--ink-2:#3C4C58;--ink-3:#6B7A86;--line:#D9E0E6;--accent:#0B6F86;--ok:#1E7A3F}
  @media (prefers-color-scheme: dark){:root{--bg:#0F171D;--surface:#172128;--ink:#E7EDF1;--ink-2:#B7C3CC;--ink-3:#8797A3;--line:#2A3742;--accent:#3FA7BE;--ok:#5BC27A}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:660px;margin:0 auto;padding:24px 16px 48px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}.head h1{margin:0;font-size:20px}.head .sub{color:var(--ink-3);font-size:13px;margin-top:4px}
  .body{padding:18px 22px 22px}label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
  input[type=text],input[type=email],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  ul{list-style:none;padding:0;margin:0}ul li{margin:6px 0}ul li label{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px}
  .btn{margin-top:16px;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
  .note{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}.err{color:#B0202E;font-size:13px}
  .ok{color:var(--ok);font-weight:600;font-size:16px}.hint{color:var(--ink-3);font-size:13px;margin-top:12px}
  .help{color:var(--ink-3);font-size:12.5px;margin-top:4px}
</style>
</head>
<body><div class="wrap"><div class="card">
  <div class="head"><h1>{% block heading %}Request equipment service{% endblock %}</h1><div class="sub">{{ tenant.name }} · Clinical Engineering</div></div>
  <div class="body">{% block body %}{% endblock %}</div>
</div></div></body></html>
