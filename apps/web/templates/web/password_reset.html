{% extends "web/auth_base.html" %}
{% block title %}Reset your password{% endblock %}
{% block card %}
  <h1 style="margin-bottom:4px">Reset your password</h1>
  <p class="hint" style="margin-bottom:14px">Enter the email address on your account and we'll email you a link to set a new password.</p>
  <form method="post" class="form" novalidate>{% csrf_token %}
    <label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required autofocus value="{{ form.email.value|default:'' }}"{% if form.email.errors %} aria-invalid="true" aria-describedby="reset-email-err"{% endif %}>
      {% if form.email.errors %}<span class="err" id="reset-email-err">{{ form.email.errors|join:" " }}</span>{% endif %}</label>
    <button class="btn primary" type="submit">Send link</button>
  </form>
  <p class="auth-foot"><a href="{% url 'web:login' %}">Back to sign in</a></p>
{% endblock %}
