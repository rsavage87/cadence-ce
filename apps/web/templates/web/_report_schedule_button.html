{# The Reports panel's Schedule button (slice 13): its state, and the modal it opens. Sent back out of band when the modal saves. #}
{% if can_schedule %}<button class="btn sm{% if schedule_sub %} sched-on{% endif %}" type="button" id="rep-schedule-{{ report.key }}"{% if oob %} hx-swap-oob="true"{% endif %} hx-get="{% url 'web:report_schedule' report.key %}" hx-target="#modal-card" aria-haspopup="dialog" title="{% if schedule_sub %}Emailed to you, {{ schedule_sub.get_frequency_display|lower }}{% else %}Email this report to yourself every Monday or every month{% endif %}">{{ schedule_label }}</button>{% endif %}
