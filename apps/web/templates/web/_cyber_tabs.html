{# The Device security screen's tabs (slice 37). Fleet and Changes for IT list devices: only for Equipment View too (can_devices). Context: cyber_tab ("fleet", "models", "changes"). #}
<div class="tabs page-tabs" role="tablist">
  {% if can_devices %}<a class="tab{% if cyber_tab == 'fleet' %} active{% endif %}" role="tab" href="{% url 'web:cybersecurity' %}"{% if cyber_tab == 'fleet' %} aria-current="page"{% endif %}>Fleet</a>{% endif %}
  <a class="tab{% if cyber_tab == 'models' %} active{% endif %}" role="tab" href="{% url 'web:cybersecurity_models' %}"{% if cyber_tab == 'models' %} aria-current="page"{% endif %}>Models</a>
  {% if can_devices %}<a class="tab{% if cyber_tab == 'changes' %} active{% endif %}" role="tab" href="{% url 'web:cybersecurity_changes' %}"{% if cyber_tab == 'changes' %} aria-current="page"{% endif %}>Changes for IT</a>{% endif %}
</div>
