{# The Contracts screen's tabs (slice 31): the contracts, and the vendors' staff (their attestations and their engineers' training on file). Context: contracts_tab ("vendors" on the Vendor staff tab; anything else is the contracts). #}
<div class="tabs page-tabs" role="tablist">
  <a class="tab{% if contracts_tab != 'vendors' %} active{% endif %}" role="tab" href="{% url 'web:contracts' %}"{% if contracts_tab != 'vendors' %} aria-current="page"{% endif %}>Contracts</a>
  <a class="tab{% if contracts_tab == 'vendors' %} active{% endif %}" role="tab" href="{% url 'web:vendor_staff' %}"{% if contracts_tab == 'vendors' %} aria-current="page"{% endif %}>Vendor staff</a>
</div>
