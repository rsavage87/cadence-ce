{% load web %}
<div class="modal-h"><h2>Invite user</h2><button class="iconbtn" type="button" data-act="close-modal" aria-label="Close">{% icon "x" %}</button></div>
<form id="nu-form" hx-post="{% url 'web:user_invite' %}" hx-target="#modal-card">
  <div class="form">
    {% if form.non_field_errors %}<div class="full"><span class="err">{{ form.non_field_errors|striptags }}</span></div>{% endif %}
    <label>First name{{ form.first_name }}{% if form.first_name.errors %}<span class="err">{{ form.first_name.errors|striptags }}</span>{% endif %}</label>
    <label>Last name{{ form.last_name }}{% if form.last_name.errors %}<span class="err">{{ form.last_name.errors|striptags }}</span>{% endif %}</label>
    <label>Work email{{ form.email }}{% if form.email.errors %}<span class="err">{{ form.email.errors|striptags }}</span>{% endif %}</label>
    <label>Role{{ form.role }}{% if form.role.errors %}<span class="err">{{ form.role.errors|striptags }}</span>{% endif %}</label>
    <label class="full">Department{{ form.department }}</label>
    <label class="full check-row">{{ form.create_technician }} Also create a technician profile so credentials and work can be assigned</label>
  </div>
  <div class="note" style="margin:0 16px 12px">No invitation email is sent yet (email delivery arrives with integrations); the account is created as Invited and an administrator sets its first password in Admin.</div>
  <div class="modal-f"><button class="btn" type="button" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Create account</button></div>
</form>
