{% load web %}
<div class="modal-h"><h2>Add credential</h2><button class="iconbtn" type="button" data-act="close-modal" aria-label="Close">{% icon "x" %}</button></div>
<form id="nc-form" hx-post="{% url 'web:credential_new' %}" hx-target="#modal-card">
  {% if form.non_field_errors %}<div class="note warn" style="margin:12px 16px 0">{{ form.non_field_errors|striptags }}</div>{% endif %}
  <div class="form">
    <label>Technician{{ form.technician }}{% if form.technician.errors %}<span class="err">{{ form.technician.errors|striptags }}</span>{% endif %}</label>
    <label>Covers{{ form.covers }}{% if form.covers.errors %}<span class="err">{{ form.covers.errors|striptags }}</span>{% endif %}</label>
    <label>Source{{ form.source }}</label>
    <label>Status{{ form.status }}</label>
    <label>Issued{{ form.issued_on }}{% if form.issued_on.errors %}<span class="err">{{ form.issued_on.errors|striptags }}</span>{% endif %}</label>
    <label>Expires, if any{{ form.expires_on }}{% if form.expires_on.errors %}<span class="err">{{ form.expires_on.errors|striptags }}</span>{% endif %}</label>
  </div>
  <div class="modal-f"><button class="btn" type="button" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Add credential</button></div>
</form>
