name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Tests run on SQLite here (settings switch on TESTING); the test-postgres job runs them on PostgreSQL.
      - run: python manage.py makemigrations --check --dry-run
        env:
          CADENCE_TESTING: "1"
      - run: pytest

  test-postgres:
    # The same suite on PostgreSQL 16, as production runs: row locks, numeric rounding, and constraints behave as they will there.
    # The test database gets the row-level security policies (tests/conftest.py), and tests/test_postgres_rls.py runs signing in,
    # the portal, every screen, the API, and the daily jobs as the runtime role the policies apply to. The service's user is a
    # superuser, as the suite needs (it builds its data without a tenant set); the tests switch roles themselves.
    name: Pytest (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CADENCE_TESTING: "1"
      CADENCE_TEST_DATABASE_URL: postgres://cadence:cadence@localhost:5432/cadence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_postgres_rls.py -rs
      - run: pytest
